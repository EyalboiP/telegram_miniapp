<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DateTime Picker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg-start: #0f172a;
    --bg-end: #1e293b;
    --card-bg: rgba(15, 23, 42, 0.72);
    --card-border: rgba(148, 163, 184, 0.2);
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #8b5cf6;
    --accent-strong: #7c3aed;
    --input-bg: rgba(15, 23, 42, 0.75);
    --input-border: rgba(148, 163, 184, 0.24);
    --shadow: 0 20px 40px rgba(15, 23, 42, 0.28);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top, rgba(139, 92, 246, 0.32), transparent 34%),
      linear-gradient(180deg, var(--bg-start), var(--bg-end));
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: min(100%, 420px);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
  }

  .eyebrow {
    margin: 0 0 8px;
    color: #c4b5fd;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 28px;
    line-height: 1.1;
  }

  .subtitle {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.5;
  }

  label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 600;
  }

  input[type="datetime-local"] {
    width: 100%;
    border: 1px solid var(--input-border);
    border-radius: 16px;
    background: var(--input-bg);
    color: var(--text-main);
    padding: 16px;
    font: inherit;
    outline: none;
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  input[type="datetime-local"]:focus {
    border-color: rgba(139, 92, 246, 0.9);
    box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.18);
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  button {
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 16px;
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    box-shadow: 0 14px 28px rgba(124, 58, 237, 0.32);
    cursor: pointer;
    transition: transform 0.18s ease, filter 0.18s ease;
  }

  button:hover {
    filter: brightness(1.06);
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(0);
  }

  .hint {
    margin: 16px 0 0;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.5;
  }

  @media (max-width: 480px) {
    body {
      padding: 16px;
    }

    .card {
      border-radius: 20px;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Attendance</p>
    <h1>Select Date &amp; Time</h1>
    <p class="subtitle">Choose the exact check-in or check-out time, then send it back to Telegram.</p>

    <label for="dt">Date and time</label>
    <input type="datetime-local" id="dt">

    <div class="actions">
      <button type="button" onclick="sendDate()">Send to Telegram</button>
    </div>

    <p class="hint">The selected value is sent back to the bot in the same format as before.</p>
  </main>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function sendDate() {
      const value = document.getElementById("dt").value;

      tg.sendData(JSON.stringify({
        datetime: value
      }));
    }
  </script>
</body>
</html>
