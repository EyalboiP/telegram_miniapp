<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DateTime Picker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>
<body>

<input type="datetime-local" id="dt">

<button onclick="sendDate()">Send</button>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

function sendDate() {
    const value = document.getElementById("dt").value;

    tg.sendData(JSON.stringify({
        datetime: value
    }));

}

</script>

</body>
</html>
